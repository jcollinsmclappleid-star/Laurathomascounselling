const pages={"home": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\"><section class=\"editorial-hero\"><div><div class=\"kicker\">Laura Thomas \u00b7 Psychotherapist & author</div><h1>Different journeys.<br>The right support<br><em>for you.</em></h1><p class=\"bodycopy\">Counselling for life\u2019s difficult moments.<br>Specialist support for parents and teenagers.<br>A connected approach, with space for your own path.</p><a class=\"line-link\" href=\"#about\">Meet Laura<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a><p class=\"author-note\">A little understanding can open a new door.</p></div><div class=\"portrait-wrap\"><img src=\"assets/laura.webp\" alt=\"Laura Thomas, actual photograph from her website\" class=\"portrait\" ><span class=\"portrait-caption\">Laura Thomas \u00b7 M.Ed \u00b7 MNCPS (Accred.)</span><span class=\"vertical-note\">Counselling \u00b7 Parenting \u00b7 Connection</span></div></section><div class=\"two-paths\"><a class=\"path\" href=\"#counselling\" data-world=\"counselling\"><img src=\"assets/room.webp\" alt=\"Concept photograph of a quiet reading corner\" class=\"path-image\" ><div class=\"pathtext\"><div class=\"kicker\">Counselling & therapeutic support</div><h2>  parents of teenage girls</div><h3>Parenting<br>Unstoppable Girls</h3><p>Exploring confidence, connection and the changing teenage years.</p><a class=\"line-link\" href=\"#book-girls\">Explore the book<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></article><article class=\"book-cell\"><div class=\"book-model\"><img src=\"assets/book-boys.webp\" alt=\"Parenting Teen Boys with Confidence by Laura Thomas, verified cover\" class=\"book-cover\" ></div><div><div class=\"kicker\">For parents of teenage boys</div><h3>Parenting Teen Boys<br>with Confidence</h3><p>Supporting resilience, independence and self-esteem in young men.</p><a class=\"line-link\" href=\"#book-boys\">Explore the book<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></article></div></section><section class=\"endcall\"><div><div class=\"kicker\">A first step, at your pace</div><h2>You don\u2019t need to have<br>all the words yet.</h2><p>Tell Laura a little about what brings you here.</p></div><a class=\"solid\" href=\"#contact\">Make an enquiry<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "split": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2 py\">From my practice in Wixams, Bedford, and through online work, we can explore the support that feels right for you.</p><a class=\"line-link\" href=\"#about\">About Laura & her experience<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "counselling": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\"><div class=\"world-breadcrumb\"><a href=\"#home\">Laura Thomas</a> / Counselling</div><section class=\"world-hero\"><div class=\"world-copy\"><div class=\"kicker\">Counselling in Wixams, Bedford & online</div><h1>Room to pause.<br>Space to<br><em>be yourself.</em></h1><p class=\"bodycopy\">When life feels difficult, being heard can be a place to begin. Explore counselling for yourself, your relationship or your family.</p><a class=\"solid\" href=\"#contact\">Make an enquiry<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div><div class=\"world-image\"><img src=\"assets/room.webp\" alt=\"Illustrative concept interior, not Laura\u2019s actual practice\" class=\"\" ><span class=\"image-credit\">Concept photography \u00b7 not the actual practice</span></div></section><nav class=\"service-nav\" aria-label=\"Counselling services\"><a href=\"#service\">Individual <span>\u2197</span></a><a href=\"#couples\">Couples <span>\u2197</span></a><a href=\"#family-service\">Families <span>\u2197</span></a><a href=\"#young\">Young people <span>\u2197</span></a><a href=\"#online\">Online <span>\u2197</span></a></nav><section class=\"section two-col\"><div><div class=\"kicker\">Begin where you are</div><h2>You can bring<br>your whole self.</h2></div><div><p class=\"bodycopy\">You may know exactly what is worrying you. Or you may simply feel that something is not right. There is room to explore either.</p><p class=\"bodycopy\">Learn about how counselling works, Laura\u2019s approach, and what to expect from your first conversation.</p><a class=\"line-link\" href=\"#service\">Explore individual counselling<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></section><section class=\"section intro-portrait\"><img src=\"assets/laura.webp\" alt=\"Laura Thomas, existing professional photograph\" class=\"\" ><div><div class=\"kicker\">Meet Laura</div><h2>One person.<br>Many ways to support you.</h2><p class=\"bodycopy\">I\u2019m Laura, a counsellor, psychotherapist and author. My work brings together therapeutic support and specialist guidance for parents and teenagers.</p><p class=\"bodycopy\">From my practice in Wixams, Bedford, and through online work, we can explore the support that feels right for you.</p><a class=\"line-link\" href=\"#about\">About Laura & her experience<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></section><section class=\"endcall\"><div><div class=\"kicker\">A first step, at your pace</div><h2>You don\u2019t need to have<br>all the words yet.</h2><p>Tell Laura a little about what brings you here.</p></div><a class=\"solid\" href=\"#contact\">Make an enquiry<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "parentology": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\" class=\"parent-world\"><div class=\"world-breadcrumb\"><a href=\"#home\">Laura Thomas</a> / Parentology introduction</div><section class=\"world-hero\"><div class=\"world-copy\"><div class=\"parent-brand\"><img src=\"assets/logo-parentology-alpha.webp\" alt=\"Parentology World, existing verified logo\" class=\"\" ></div><div class=\"kicker\">Laura\u2019s specialist world for parents & teens</div><h1>More understanding.<br><em>Stronger connection.</em></h1><p class=\"bodycopy\">The teenage years change things. You can find support to understand what\u2019s happening and explore a way forward, together.</p><a class=\"solid warm\" href=\"#parent-support\">Explore the support below<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div><div class=\"world-image\"><img src=\"assets/family.webp\" alt=\"Fictional parent and teen in a generated concept photograph\" class=\"\" ><span class=\"image-credit\">Concept photography \u00b7 fictional family</span></div></section><nav class=\"service-nav\" aria-label=\"Parentology introduction\"><a href=\"#parent-support\">Parent support <span>\u2193</span></a><a href=\"#intouch\">In-Touch <span>\u2193</span></a><a href=\"#reset\">RESET <span>\u2193</span></a><a href=\"#parent-books\">Books <span>\u2193</span></a><a href=\"https://www.parentologyworld.com/\">Parentology World <span>\u2197</span></a></nav><section class=\"section two-col\"><div><div class=\"kicker\">A connected part of Laura\u2019s work</div><h2>The same Laura.<br>A specialist<br><em>kind of support.</em></h2></div><div><p class=\"bodycopy\">Parentology is Laura\u2019s dedicated home for support with parenting and teenage wellbeing. It connects her work with families, her writing and practical guidance for everyday life.</p><p class=\"bodycopy\">Explore an introduction here. The full programmes, resources and service details live at Parentology World.</p><a class=\"line-link\" href=\"#about\">Meet Laura<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></section><section class=\"section\" id=\"parent-support\"><div class=\"section-header\"><div><div class=\"kicker\">Different needs. Thoughtful pathways.</div><h2>Support that meets<br>your family where you are.</h2></div><p>Find the right place to start, then continue to the full service at Parentology World.</p></div><div class=\"service-grid\"><article class=\"service-card\"><span class=\"num\">01</span><h3>For parents.</h3><p>Space to make sense of what is happening and explore your next steps with Laura.</p><a class=\"line-link\" href=\"https://www.parentologyworld.com/\">Explore parent support <span class=\"arrow\">\u2197</span></a></article><article class=\"service-card\"><span class=\"num\">02</span><h3>For teenagers.</h3><p>A dedicated route to Laura\u2019s teen counselling and coaching, with the young person\u2019s voice at its heart.</p><a class=\"line-link\" href=\"https://www.parentologyworld.com/teen-support\">Explore teen support <span class=\"arrow\">\u2197</span></a></article><article class=\"service-card\"><span class=\"num\">03</span><h3>Between the sessions.</h3><p>Discover In-Touch, Laura\u2019s ongoing parent support offer.</p><a class=\"line-link\" href=\"https://www.parentologyworld.com/intouch\">Discover In-Touch <span class=\"arrow\">\u2197</span></a></article></div></section><section id=\"intouch\" class=\"section dark-section intouch\"><div><div class=\"kicker\">Introducing In-Touch</div><h2>Support for<br><em>the in-between.</em></h2><p>Parenting carries on between appointments. In-Touch offers messaging and voice-note guidance for parents, Monday to Friday.</p><a class=\"line-link\" href=\"https://www.parentologyworld.com/intouch\">See how In-Touch works <span class=\"arrow\">\u2197</span></a></div><div class=\"message-art\" aria-label=\"Illustrative voice-note motif\"><div class=\"tag\">In-Touch \u00b7 With Laura Thomas</div><h3>A little perspective.<br>A clearer next step.</h3><div class=\"soundline\" aria-hidden=\"true\"><i style=\"--h:10px\"></i><i style=\"--h:17px\"></i><i style=\"--h:28px\"></i><i style=\"--h:40px\"></i><i style=\"--h:24px\"></i><i style=\"--h:45px\"></i><i style=\"--h:34px\"></i><i style=\"--h:51px\"></i><i style=\"--h:29px\"></i><i style=\"--h:17px\"></i><i style=\"--h:36px\"></i><i style=\"--h:48px\"></i><i style=\"--h:28px\"></i><i style=\"--h:40px\"></i><i style=\"--h:24px\"></i><i style=\"--h:12px\"></i><i style=\"--h:26px\"></i><i style=\"--h:34px\"></i><i style=\"--h:16px\"></i><i style=\"--h:8px\"></i></div><small>Illustrative motif \u00b7 no client messages shown</small></div></sectio tion></div><section class=\"section\"><div class=\"section-header\"><div><div class=\"kicker\">Ideas to explore with Laura</div><h2>Understanding,<br>one conversation at a time.</h2></div><a class=\"line-link\" href=\"https://www.parentologyworld.com/resources\">Resources at Parentology World \u2197</a></div><div class=\"article-grid\"><article class=\"article-teaser\"><img src=\"assets/family.webp\" alt=\"Concept family photograph\" class=\"\" ><div><div class=\"kicker\">Proposed expert article</div><h3>When your teen pulls away, where do you begin?</h3><a class=\"line-link\" href=\"#article\">Preview the article design<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></article><article class=\"article-teaser\"><img src=\"assets/detail.webp\" alt=\"Detail photograph from Laura\u2019s existing practice\" class=\"\" ><div><div class=\"kicker\">Research & experience</div><h3>Helping parents feel heard.</h3><p>Explore Laura\u2019s professional background and research interests.</p><a class=\"line-link\" href=\"#about\">About Laura<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></article></div></section><section class=\"endcall\"><div><div class=\"kicker\">Continue your journey</div><h2>Find your next step<br>at Parentology World.</h2><p>Explore Laura\u2019s specialist support, programmes and resources.</p></div><a class=\"solid warm\" href=\"https://www.parentologyworld.com/\">Visit Parentology World <span class=\"arrow\">\u2197</span></a></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "books": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\"><section class=\"book-stage\"><div><div class=\"kicker\">Laura Thomas \u00b7 Books & publications</div><h1>For the<br>conversations<br><em>that matter.</em></h1><p>Two thoughtful guides to the teenage years. Written by Laura Thomas, psychotherapist and founder of Parentology World.</p><a class=\"line-link\" href=\"#book-list\">Explore both books below<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div><div class=\"stage-books\"><div class=\"book-model\"><img src=\"assets/book-girls.webp\" alt=\"Parenting Unstoppable Girls, verified cover\" class=\"book-cover\" ></div><div class=\"book-model\"><img src=\"assets/book-boys.webp\" alt=\"Parenting Teen Boys with Confidence, verified cover\" class=\"book-cover\" ></div></div></section><div id=\"book-list\"><section class=\"section books\"><div class=\"section-header\"><div><div class=\"kicker\">The author behind the approach</div><h2>Understanding that<br>travels beyond the room.</h2></div><p>Two books bringing Laura\u2019s parenting expertise into everyday family life.</p></div><div class=\"book-grid\"><article class=\"book-cell\"><div class=\"book-model\"><img src=\"assets/book-girls.webp\" alt=\"Parenting Unstoppable Girls by Laura Thomas, verified cover\" class=\"book-cover\" ></div><div><div class=\"kicker\">For parents of teenage girls</div><h3>Parenting<br>Unstoppable Girls</h3><p>Exploring confidence, connection and the changing teenage years.</p><a class=\"line-link\" href=\"#book-girls\">Explore the book<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></article><article class=\"book-cell\"><div class=\"book-model\"><img src=\"assets/book-boys.webp\" alt=\"Parenting Teen Boys with Confidence by Laura Thomas, verified cover\" class=\"book-cover\" ></div><div><div class=\"kicker\">For parents of teenage boys</div><h3>Parenting Teen Boys<br>with Confidence</h3><p>Supporting resilience, independence and self-esteem in young men.</p><a class=\"line-link\" href=\"#book-boys\">Explore the book<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></article></div></section></div><section class=\"section two-col\"><div><div class=\"kicker\">From the page to your family</div><h2>Read. Reflect.<br><em>Reconnect.</em></h2></div><div><p class=\"bodycopy\">Explore book themes through original, expert-led articles, then choose a practical resource or a conversation with Laura.</p><a class=\"line-link\" href=\"#article\">Preview an expert article<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a><a class=\"line-link\" href=\"#parentology\">Discover Parentology<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></section><section class=\"endcall\"><div><div class=\"kicker\">Continue your journey</div><h2>Find your next step<br>at Parentology World.</h2><p>Explore Laura\u2019s specialist support, programmes and resources.</p></div><a class=\"solid warm\" href=\"https://www.parentologyworld.com/\">Visit Parentology World <span class=\"arrow\">\u2197</span></a></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "service": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\"><div class=\"world-breadcrumb\"><a href=\"#counselling\">Counselling</a> / Individual counselling</div><section class=\"service-hero\"><div><div class=\"kicker\">Individual counselling \u00b7 Wixams, Bedford & online</div><h1>You don\u2019t have<br>to hold it all<br><em>on your own.</em></h1><p class=\"bodycopy\">A space to talk about what is troubling you, understand your feelings and explore what you need.</p><a class=\"solid\" href=\"#contact\">Enquire about counselling<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a><p class=\"muted\" style=\"font-size:10px;margin-top:17px\">Prefer to read first? <a href=\"#session-faq\">What to expect \u2193</a></p></div><div class=\"image-box\"><img src=\"assets/room.webp\" alt=\"Illustrative concept interior, not the actual practice\" class=\"\" ><span class=\"image-credit\">Concept photography \u00b7 not the actual practice</span></div></section><div class=\"reassurance\"><span>M.Ed \u00b7 MNCPS (Accred.)</span><span>Integrative, humanistic approach</span><span>In person in Wixams \u00b7 Online</span></div><section class=\"section two-col\"><div><div class=\"kicker\">Room for what is on your mind</div><h2>You don\u2019t need<br>the perfect<br><em>starting point.</em></h2></div><div><p class=\"bodycopy\">You may feel overwhelmed, anxious or stuck. Perhaps a relationship is difficult, or you are finding it hard to make sense of how you feel. We can begin with what matters to you.</p><div class=\"concern-list\"><span>Anxiety & overthinking</span><span>Low mood & overwhelm</span><span>Relationships & change</span><span>Confidence & identity</span></div></div></section><section class=\"section dark-section\"><div class=\"kicker\">A clear, gentle way to begin</div><h2>One step at a time.</h2><div class=\"steps\"><article><b>01</b><h3>Make contact.</h3><p>Share what you are looking for. You can ask questions before deciding on your next step.</p></article><article><b>02</b><h3>Meet Laura.</h3><p>Explore what brings you to counselling and whether working together feels right.</p></article><article><b>03</b><h3>Find your pace.</h3><p>Discuss what you would like from the work and review how it is going together.</p></article></div></section><section class=\"section intro-portrait\"><img src=\"assets/laura.webp\" alt=\"Laura Thomas, existing professional photograph\" class=\"\" ><div><div class=\"kicker\">Meet Laura</div><h2>One person.<br>Many ways to support you.</h2><p class=\"bodycopy\">I\u2019m Laura, a counsellor, psychotherapist and author. My work brings together therapeutic support and specialist guidance for parents and teenagers.</p><p class=\"bodycopy\">From my practice in Wixams, Bedford, and through online work, we can explore the support that feels right for you.</p><a class=\"line-link\" href=\"#about\">About Laura & her experience<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></section><section id=\"session-faq\" class=\"section\"><div class=\"section-header\"><div><div class=\"kicker\">Before your first session</div><h2>A little clarity can help.</h2></div><a class=\"line-link\" href=\"#fees\">Fees & all questions<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div><div class=\"faqs\"><details open><summary>What if I don\u2019t know what to say?</summary><p>You can begin by sharing whatever feels possible. You do not need to arrive with a complete explanation of how you are feeling.</p></details><details><summary>Can we meet online?</summary><p>Laura offers online work. You can discuss suitability, privacy and practical arrangements before starting.</p></details><details><summary>What does counselling cost?</summary><p>The existing website lists support from \u00a395. Confirm the current fee, duration and arrangements directly with Laura before booking.</p></details><details><summary>What about confidentiality?</summary><p>Laura will explain confidentiality and its limits before the work begins, so you understand how your information is handled.</p></details></div></section><section class=\"section books\"><div class=\"kicker\">Related support</div><div class=\"section-header\"><h2>Looking for a<br>different kind of space?</h2><div><a class=\"line-link\" href=\"#couples\">Couples counselling<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a><a class=\"line-link\" href=\"#parentology\">Support for parents & teens<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></div></section><section class=\"endcall\"><div><div class=\"kicker\">A first step, at your pace</div><h2>You don\u2019t need to have<br>all the words yet.</h2><p>Tell Laura a little about what brings you here.</p></div><a class=\"solid\" href=\"#contact\">Make an enquiry<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "article": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\"><div class=\"world-breadcrumb\"><a href=\"#parentology\">Parentology introduction</a> / Insights / Connection</div><section class=\"article-head\"><div class=\"kicker\">Parenting & connection \u00b7 Proposed expert article</div><h1>When your teen pulls away,<br><em>where do you begin?</em></h1><p class=\"dek\">When conversations become shorter, a gentler way to connect can leave room for understanding.</p><div class=\"author-row\"><img src=\"assets/laura.webp\" alt=\"Laura Thomas\" class=\"\" ><span>Proposed for Laura Thomas \u00b7 Author review pending<br>Book theme: communication & trust</span></div></section><img src=\"assets/family.webp\" alt=\"Fictional parent and teenager, concept photography\" class=\"article-banner\" ><div class=\"article-body\"><aside class=\"contents\"><strong>In this article</strong><a href=\"#short-answer\">A place to begin</a><a href=\"#listen\">Making room to listen</a><a href=\"#book-connection\">The book connection</a><a href=\"#further-help\">Finding support</a></aside><article class=\"reading\"><div class=\"conceptlabel\">Illustrative editorial copy \u00b7 for Laura\u2019s review</div><div id=\"short-answer\" class=\"answer\">Start with an invitation rather than a demand for an explanation. Choose a quieter moment, show interest and leave space for a reply.</div><p>When conversations become shorter, it can be tempting to fill every silence. A small, ordinary moment together may offer a gentler starting point than a big conversation about everything that has changed.</p><h2 id=\"listen\">Making room to listen.</h2><p>You might notice when conversation feels easier: in the car, making food, or walking somewhere together. The aim is to make room for their perspective, without turning every exchange into a lesson.</p><p>Clear boundaries can sit alongside curiosity. You can acknowledge a difficult feeling while staying clear about what is possible in your household.</p><div id=\"book-connection\" class=\"sourcebook\"><img src=\"assets/book-girls.webp\" alt=\"Verified cover of Parenting Unstoppable Girls\" class=\"\" ><div><div class=\"kicker\">Explore the related book</div><h3>Parenting Unstoppable Girls</h3><p>Explore trust, communication and boundaries in Laura\u2019s guide to raising teenage girls.</p><a class=\"line-link\" href=\"#book-girls\">About the book<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div></div><h2 id=\"further-help\">Support for your next step.</h2><p>If you would like help thinking about what is happening in your family, explore Laura\u2019s specialist support through Parentology World.</p><a class=\"solid warm\" href=\"#parentology\">Discover Parentology<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a><p class=\"attribution\">Related expertise: Laura Thomas is a psychotherapist, author and founder of Parentology World. Explore her professional background and connected support.</p></article></div><section class=\"endcall\"><div><div class=\"kicker\">Continue your journey</div><h2>Find your next step<br>at Parentology World.</h2><p>Explore Laura\u2019s specialist support, programmes and resources.</p></div><a class=\"solid warm\" href=\"https://www.parentologyworld.com/\">Visit Parentology World <span class=\"arrow\">\u2197</span></a></section></main><footer class=\"footer\"><div class=\"wordmark\">Laura Thomas<small>Counselling & connected expertise</small></div><p>Wixams, Bedford \u00b7 Online support<br>hello@laurathomascounselling.co.uk \u00b7 07915 431739</p><div><a href=\"#contact\">Contact & first steps \u2197</a><br><span>Creative proposal \u00b7 Therapist Website Studio</span></div></footer>", "about": "<header class=\"masthead\"><a class=\"wordmark\" href=\"#home\">Laura Thomas<small>Counselling \u00b7 Parenting \u00b7 Author</small></a><nav class=\"mainnav\" aria-label=\"Main navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books</a><a href=\"#about\">About Laura</a><a class=\"bookcall\" href=\"#contact\">Make an enquiry \u2197</a></nav><button class=\"mobilemenu\" aria-expanded=\"false\" aria-controls=\"mobile-links\">Menu \u2630</button><nav id=\"mobile-links\" class=\"menu-panel hidden\" aria-label=\"Mobile navigation\"><a href=\"#counselling\">Counselling</a><a href=\"#parentology\">Parentology</a><a href=\"#books\">Books & publications</a><a href=\"#about\">About Laura</a><a href=\"#contact\">Make an enquiry</a></nav></header><main id=\"main\"><section class=\"service-hero\"><div><div class=\"kicker\">Counsellor \u00b7 Psychotherapist \u00b7 Author</div><h1>Hello,<br><em>I\u2019m Laura.</em></h1><p class=\"bodycopy\">My work connects counselling, support for parents and teenagers, and writing. Explore the part of my work that feels right for you.</p><div class=\"book-meta\">M.Ed. Social, Emotional and Mental Health<br>B.Sc. (Hons) Psychology<br>MNCPS (Accred.)</div><a class=\"solid\" href=\"#counselling\">View counselling<span class=\"arrow\" aria-hidden=\"true\">\u2197</span></a></div><div><img src=\"assets/laura.we function show(route,focus=false){if(!pages[route])return false;current=route;screen.innerHTML=pages[route];screen.classList.remove('hidden');screen.inert=false;document.body.style.background=route==='parentology'?'#f7efe5':'#f5f1e8';document.querySelectorAll('[data-preview]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.preview===route)));window.scrollTo(0,0);if(focus){const h=screen.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}status.textContent=route==='parentology'?'Parentology introduction. Full services continue at Parentology World.':route==='counselling'?'Counselling. Choose a service or make an enquiry.':'';return true}
function navigate(route,focus=true){if(show(route,focus))history.pushState({route},'',location.pathname+location.search+'#'+route);else {const target=document.getElementById(route);if(target){target.scrollIntoView({behavior:'auto'});target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}}}
async function enter(route,source){if(pending)return;origin=current;cancelled=false;const im=source.querySelector('img');if(!im||reduced()){navigate(route);return}const rect=im.getBoundingClientRect();const layer=document.createElement('div');layer.className='motion-overlay';layer.setAttribute('aria-hidden','true');layer.style.background=route==='parentology'?'#ebd7c7':'#dfe5d6';const clone=im.cloneNode();Object.assign(clone.style,{position:'absolute',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',maxWidth:'none',objectFit:'cover',transformOrigin:'50% 50%'});layer.append(clone);document.body.append(layer);const skip=document.getElementById('skip-motion');skip.hidden=false;screen.inert=true;const mobile=innerWidth<601;const dur=mobile?420:680;const ease='cubic-bezier(.22,1,.36,1)';pending=clone.animate([{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',transform:'perspective(1400px) rotateX(0deg) rotateY(0deg)'},{transform:'perspective(1400px) rotateX(1.2deg) rotateY(-.8deg)',offset:.4},{left:'0px',top:'0px',width:innerWidth+'px',height:innerHeight+'px',transform:'perspective(1400px) rotateX(0deg) rotateY(0deg)'}],{duration:dur,easing:ease,fill:'forwards'});try{await pending.finished;if(cancelled)return;show(route);const target=screen.querySelector('.world-image img');const r=target.getBoundingClientRect();clone.style.left='0';clone.style.top='0';clone.style.width=innerWidth+'px';clone.style.height=innerHeight+'px';pending.cancel();pending=clone.animate([{left:'0px',top:'0px',width:innerWidth+'px',height:innerHeight+'px'},{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'}],{duration:mobile?180:300,easing:ease,fill:'forwards'});await pending.finished;if(cancelled)return;layer.remove();navigate(route);screen.querySelectorAll('.world-copy>*').forEach((el,i)=>{if(!reduced())el.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:300,delay:i*35,easing:ease,fill:'both'})});}catch(e){}finally{pending=null;layer.remove();skip.hidden=true;screen.inert=false}}
function skip(){cancelled=true;pending?.cancel();pending=null;document.querySelectorAll('.motion-overlay').forEach(x=>x.remove());document.getElementById('skip-motion').hidden=true;navigate('parentology')}
document.getElementById('skip-motion').onclick=()=>{const r=location.hash==='#counselling'?'counselling':'parentology';cancelled=true;pending?.cancel();pending=null;document.querySelectorAll('.motion-overlay').forEach(x=>x.remove());document.getElementById('skip-motion').hidden=true;navigate(window.transitionRoute||r)};
document.addEventListener('click',e=>{const control=e.target.closest('[data-preview]');if(control){navigate(control.dataset.preview);return}const menu=e.target.closest('.mobilemenu');if(menu){let panel=screen.querySelector('.menu-panel');panel.classList.toggle('hidden');menu.setAttribute('aria-expanded',String(!panel.classList.contains('hidden')));return}const a=e.target.closest('a[href^="#"]');if(!a)return;const r=a.getAttribute('href').slice(1);e.preventDefault();if(a.dataset.world){window.transitionRoute=r;enter(r,a)}else navigate(r)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pending){cancelled=true;pending.cancel();pending=null;document.querySelectorAll('.motion-overlay').forEach(x=>x.remove());document.getElementById('skip-motion').hidden=true;show(origin,true)}});
window.addEventListener('resize',()=>{if(pending){cancelled=true;pending.cancel();pending=null;document.querySelectorAll('.motion-overlay').forEach(x=>x.remove());document.getElementById('skip-motion').hidden=true;navigate(window.transitionRoute||origin)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pending){const menu=screen.querySelector('.menu-panel');const button=screen.querySelector('.mobilemenu');if(menu&&!menu.classList.contains('hidden')){menu.classList.add('hidden');button.setAttribute('aria-expanded','false');button.focus()}}});window.addEventListener('popstate',()=>show(location.hash.slice(1)||'home',true));show(pages[location.hash.slice(1)]?location.hash.slice(1):'home');
</script></body></html>
